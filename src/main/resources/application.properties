spring.application.name=webproveedores
server.port=8088
spring.datasource.url=jdbc:postgresql://localhost:5432/db_proveedores
spring.datasource.username=postgres
spring.datasource.password=postgre
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configuración de Logs en consola y archivo
logging.level.root=INFO
logging.level.com.upc.webproveedores=info
logging.file.name=logs/api.log
#Evitando enviar el trace al cliente
spring.web.error.include-stacktrace=never

